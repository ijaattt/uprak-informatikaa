<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Risollll setengah mateng by OIFYOO</title>
    <style>
        /* Gaya Dasar */
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            background-color: #f7a103;
            color: #ffffff;
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* ===== ANIMASI EMOJI JATUH ===== */
        .flower-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }
        .flower-container span {
            position: absolute;
            top: -10%;
            font-size: 24px;
            animation: fall 6s linear infinite;
        }
        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0.5; }
        }
        .flower-container span:nth-child(1){left:10%; animation-delay:0s;}
        .flower-container span:nth-child(2){left:30%; animation-delay:2s;}
        .flower-container span:nth-child(3){left:50%; animation-delay:4s;}
        .flower-container span:nth-child(4){left:70%; animation-delay:1s;}
        .flower-container span:nth-child(5){left:90%; animation-delay:3s;}

        /* ===== HEADER ===== */
        header.navbar {
            background-color: #bd7810;
            text-align: center;
            padding: 40px 20px;
            border-bottom-left-radius: 50px;
            border-bottom-right-radius: 50px;
            position: relative;
            z-index: 1;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .logo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 5px solid white;
            object-fit: cover;
        }
        .brand {
            display: block;
            font-size: 28px;
            font-weight: 800;
            margin-top: 15px;
            letter-spacing: 1px;
        }

        /* ===== PRODUK GRID ===== */
        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            max-width: 1100px;
            margin: 0 auto 60px;
            padding: 0 20px;
            position: relative;
            z-index: 1;
        }
        .product-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            border-radius: 30px;
            padding: 25px;
            text-align: center;
            transition: 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* Menjaga tombol tetap di bawah */
        }
        
        .product-card img {
            width: 100%;
            height: auto;
            max-height: 280px;
            object-fit: contain;
            border-radius: 20px;
            margin-top: 30px; 
            margin-bottom: 20px;
            transition: transform 0.3s;
        }
        
        .product-card:hover {
            transform: translateY(-10px);
            background: rgba(255, 255, 255, 0.2);
        }

        .price { 
            font-weight: 700; 
            font-size: 1.4rem; 
            color: #4a3007; /* Warna lebih gelap agar kontras */
            margin-bottom: 20px; 
            display: block; 
        }

        button {
            background-color: #ffffff;
            color: #bd7810;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 700;
            transition: 0.3s;
        }
        button:hover { 
            background-color: #4a3007; 
            color: white; 
        }

        /* ===== FOOTER ===== */
        footer {
            background-color: #bd7810;
            padding: 60px 20px 40px;
            border-top-left-radius: 50px;
            border-top-right-radius: 50px;
        }
        .footer-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 40px;
            max-width: 1100px;
            margin: 0 auto;
        }
        .footer-col h3 {
            margin-top: 0;
            border-bottom: 2px solid rgba(255,255,255,0.3);
            display: inline-block;
            padding-bottom: 5px;
        }
    </style>
</head>
<body>

    <div class="flower-container">
        <span>🌯</span><span>🫔</span><span>🍴</span><span>🌯</span><span>🫔</span>
    </div>

    <header class="navbar">
        <div class="logo-wrap">
            <img src="logo.jpeg" class="logo" alt="Logo OIFYOO">
            <span class="brand">Risol Oifyoo</span>
        </div>
    </header>

    <section class="hero">
        <h1 style="text-align: center;">PRODUK BEST SELLER</h1>
        <p style="text-align: center;">Premium • Fresh • Homemade</p>
    </section>

    <main class="products">
        <div class="product-card">
            <img src="mix sweet risol.jpeg" alt="Risol Mix Sweet">
            <div class="product-info">
                <h3>Risol Mix Sweet</h3>
                <span class="price">Rp 36.730</span>
                <button onclick="tambahKeKeranjang('Risol Mix Sweet')">Tambah ke Keranjang</button>
            </div>
        </div>

        <div class="product-card">
            <img src="mix cheese risol.jpeg" alt="Risol Mix Cheese">
            <div class="product-info">
                <h3>Risol Mix Cheese</h3>
                <span class="price">Rp 45.443</span>
                <button onclick="tambahKeKeranjang('Risol Mix Cheese')">Tambah ke Keranjang</button>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-container">
            <div class="footer-col">
                <h3>OIFYOO</h3>
                <p>Risol setengah mateng dengan 6 varian isi yang menggiurkan.</p>
            </div>
            <div class="footer-col">
                <h3>Kontak</h3>
                <p>📞 +62 896-7266-0862</p>
                <p>📍 Bandung & Cimahi</p>
            </div>
            <div class="footer-col">
                <h3>Social Media</h3>
                <p>Instagram: @new.oifyoo</p>
                <p>TikTok: @Oifyoo</p>
            </div>
        </div>
    </footer>

    <script>
        function tambahKeKeranjang(namaProduk) {
            alert("Berhasil! " + namaProduk + " telah ditambahkan ke keranjang belanja Anda. ✨");
        }
    </script>

</body>
</html>
